name: "🐛 Bug report"
description: Report errors or unexpected behavior
labels: 
- bug
body:
- type: markdown
  attributes:
    value: |
      Please make sure to [search for existing issues](https://github.com/dragonofmercy/Dragon-Better-History/issues) before filing a new one!

      Please write your issue in **English**.

      This form is for bug reports only.
- type: textarea
  attributes:
    label: Steps to reproduce
    description: We highly suggest including screenshots or code sample.
    placeholder: Tell us the steps required to trigger your bug.
  validations:
    required: true

- type: textarea
  attributes:
    label: ✔️ Expected Behavior
    placeholder: What were you expecting?
  validations:
    required: false

- type: textarea
  attributes:
    label: ❌ Actual Behavior
    placeholder: What happened instead?
  validations:
    required: false

- type: input
  attributes:
    label: Extension version
    placeholder: e.g. 2.2.0
  validations:
    required: true

- type: input
  attributes:
    label: Browser and version
    placeholder: e.g. Chrome 130, Edge 130
  validations:
    required: true
